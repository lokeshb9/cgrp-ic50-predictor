[pytest]
# Pytest Configuration for CGRP Predictor
# ========================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add source to Python path
pythonpath = src

# Output options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=src/cgrp_predictor
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=70

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_java: marks tests that require Java to be installed

# Coverage options
[coverage:run]
source = src/cgrp_predictor
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

