biography_tab:
  header:
    name: "Dani Geiger"
    title: "ML Engineer & Bioinformatics Researcher"
    tagline: "Using AI to discover safer treatments for chronic diseases"
  
  gallery:
    title: "Personal Gallery"
    icon: "📸"
  
  sections:
    about_me:
      title: "About Me"
      icon: "👤"
      content: |
        I am passionate about using **machine learning to improve personalized medicine, drug discovery, and diagnostics**. 
        I want to apply AI to NCBI research to find better ways to treat diseases, make healthcare more individualized, 
        and improve diagnostics.
        <br><br>
        This includes both **subjective diagnostics** (patient-reported symptoms) and **objective diagnostics** 
        based on data collected using biotechnology. With the right data and tools, I believe we can make healthcare 
        more proactive and accessible for everyone.
    
    why_cgrp:
      title: "Why CGRP?"
      icon: "💊"
      content: |
        My interest in discovering alternative therapeutic agents, particularly **CGRP receptor antagonists**, 
        stems from a **permanent complication my mother experienced** after receiving a monoclonal antibody 
        targeting the CGRP receptor.
        <br><br>
        Unfortunately, despite being a chronic migraine sufferer, she has yet to find a truly safe and effective 
        treatment. This personal experience drives my research to identify safer small-molecule alternatives that 
        could help millions of people suffering from chronic migraines.
  
  research_interests:
    title: "Research Interests"
    icon: "🔬"
    topics:
      - "AI-Driven Drug Discovery"
      - "Protein Structure Prediction (AlphaFold)"
      - "Precision Medicine & Genomics"
      - "Molecular Docking & QSAR"
      - "Biological Aging & Longevity"
      - "Blood Biomarkers"
      - "Clinical AI Applications"
  
  personal_interests:
    title: "Personal Interests"
    icon: "❤️"
    topics:
      - "Tutoring Math & Chemistry"
      - "Working with Horses"
      - "Watercoloring Botanicals"
      - "Hiking with My Dog"
  
  connect:
    title: "Connect"
    icon: "🔗"
    links:
      github:
        label: "GitHub"
        url: "https://github.com/danigeiger"
      linkedin:
        label: "LinkedIn"
        url: "https://linkedin.com"
      email:
        label: "Email"
        value: "dani.geiger@example.com"

