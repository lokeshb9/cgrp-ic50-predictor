# Content Configuration for CGRP Predictor
# =========================================
# All user-facing text content in one maintainable location
# Edit this file to change any text in the application

app:
  title: "CGRP Receptor Antagonist IC50 Predictor"
  subtitle: "Machine learning-powered drug discovery for migraine treatments"

predictor_tab:
  info_sections:
    how_it_works:
      title: "How This Tool Works"
      icon: "ℹ️"
      content:
        what_it_does: "Predicts IC50 values (the concentration needed to inhibit 50% of CGRP receptor activity) for small molecules using machine learning."
        steps:
          - step: 1
            icon: "📤"
            text: "You upload molecules (ChEMBL IDs + SMILES)"
          - step: 2
            icon: "🧬"
            text: "We generate molecular fingerprints (PaDEL)"
          - step: 3
            icon: "🤖"
            text: "Random Forest predicts IC50 values"
          - step: 4
            icon: "📊"
            text: "Results show activity classification"
        why_useful: "Quickly screen compounds for CGRP inhibition without lab testing!"
    
    model_details:
      title: "Model Details & Limitations"
      icon: "📈"
      performance:
        r2_score: 0.82
        r2_description: "82% accuracy"
        training_samples: 538
        algorithm: "Random Forest"
        trees: 175
      limitations:
        - "Computational estimates only (not experimental data)"
        - "Best for molecules < 2,000 Daltons"
        - "Most accurate for gepant-like structures"
        - "Requires Java (for fingerprint generation)"
      processing_time: "~3 seconds per 20 molecules"
  
  upload_section:
    title: "Upload Your Molecular Data"
    description: "Upload a file containing ChEMBL IDs and SMILES strings to get IC50 predictions."
    file_format_help: "📝 File must have exactly 2 columns: ChEMBL_ID and SMILES (no headers)"
    radio_help: "Both formats work the same - choose what you prefer"
  
  model_performance_card:
    title: "Model Performance"
    icon: "📊"
    metrics:
      r2_label: "R² Score"
      r2_value: "0.82"
      accuracy_label: "Accuracy"
      accuracy_value: "82% variance explained"
      training_label: "Trained on 538 compounds"
  
  results:
    summary_title: "Summary Statistics"
    detailed_title: "Detailed Results"
    metrics:
      total:
        label: "Total Analyzed"
        unit: "molecules"
      active:
        label: "Active"
        emoji: "🟢"
        description: "Strong inhibitors"
        color: "#28a745"
      intermediate:
        label: "Intermediate"
        emoji: "🟡"
        description: "Moderate activity"
        color: "#d39e00"
      inactive:
        label: "Inactive"
        emoji: "🔴"
        description: "Weak/no inhibition"
        color: "#dc3545"
  
  ic50_interpretation:
    title: "Understanding Your Results"
    icon: "💡"
    what_is_ic50: "IC50 (Inhibitory Concentration 50%) is the concentration of a compound needed to block 50% of CGRP receptor activity. It's measured in nanomolar (nM)."
    classification_guide_title: "Classification Guide"
    classifications:
      active:
        emoji: "🟢"
        name: "Active"
        threshold: "< 1,000 nM"
        description: "Strong inhibitor"
        detail: "High therapeutic potential"
        background: "#d4edda"
        border: "#28a745"
        text_color: "#155724"
      intermediate:
        emoji: "🟡"
        name: "Intermediate"
        threshold: "1,000 - 10,000 nM"
        description: "Moderate activity"
        detail: "May need optimization"
        background: "#fff3cd"
        border: "#ffc107"
        text_color: "#856404"
      inactive:
        emoji: "🔴"
        name: "Inactive"
        threshold: "> 10,000 nM"
        description: "Weak/no inhibition"
        detail: "Not a viable candidate"
        background: "#f8d7da"
        border: "#dc3545"
        text_color: "#721c24"
    key_takeaway: "Lower IC50 = Better! A compound with IC50 of 100 nM is **10x stronger** than one with 1,000 nM. FDA-approved gepants typically have IC50 values between 0.1 nM and 100 nM."
  
  examples:
    title: "Need an Example?"
    subtitle: "Don't have a file? Download one of our example files to test the tool!"
    format_preview_title: "See Expected File Format"
    format_note: "No column headers in the actual file - just two columns separated by comma or tab"
    files:
      csv:
        title: "CSV Format"
        description: "Comma-separated (recommended for Excel)"
      txt:
        title: "TXT Format"
        description: "Tab-separated (alternative)"

